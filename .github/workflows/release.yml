name: Release

# Push a tag like v0.3.0 to build the extension and publish it as a GitHub Release
# with the .vsix attached. "Run workflow" (manual) only builds and keeps the .vsix as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: read-only by default, write only where the release is created.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment shows the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # No dependency needs install scripts; skipping them blocks a compromised package from running code here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$VERSION' is not a valid semver version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Bump \"version\" in package.json or fix the tag."
            exit 1
          fi

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run package -- --out "work-monitor-$VERSION.vsix"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: work-monitor-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  release:
    # Separate job: only this one gets write access, and it runs no third-party code.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          VSIX="work-monitor-$VERSION.vsix"
          cat > notes.md <<EOF
          ## Install

          1. Download **$VSIX** below.
          2. In VS Code open **Extensions** (Ctrl+Shift+X) → **…** menu → **Install from VSIX…** and pick the file.
             Or run: \`code --install-extension $VSIX --force\`
          3. Reload VS Code windows (**Developer: Reload Window**).

          EOF
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "Work Monitor $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
