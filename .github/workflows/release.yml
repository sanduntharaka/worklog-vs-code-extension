name: Release

# Push a tag like v0.3.0 to build the extension and publish it as a GitHub Release
# with the .vsix attached. "Run workflow" (manual) only builds and keeps the .vsix as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}. Bump \"version\" in package.json or fix the tag."
            exit 1
          fi

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        run: npm run package -- --out work-monitor-${{ steps.version.outputs.version }}.vsix

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-monitor-${{ steps.version.outputs.version }}
          path: work-monitor-${{ steps.version.outputs.version }}.vsix

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="work-monitor-${{ steps.version.outputs.version }}.vsix"
          cat > notes.md <<EOF
          ## Install

          1. Download **$VSIX** below.
          2. In VS Code open **Extensions** (Ctrl+Shift+X) → **…** menu → **Install from VSIX…** and pick the file.
             Or run: \`code --install-extension $VSIX --force\`
          3. Reload VS Code windows (**Developer: Reload Window**).

          EOF
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "Work Monitor $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
