name: Release

# Builds the extension on every push to main, and publishes a GitHub Release with the .vsix
# attached whenever the version in package.json has not been released yet:
#   bump "version" in package.json → push to main → release v<version> appears.
# Pushes that keep the same version only build (the .vsix is kept as a run artifact).
# Also: push a tag like v0.3.0, or Actions → Release → Run workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release if this version is not released yet'
        type: boolean
        default: true

# Least privilege: read-only by default, write only where the release is created.
permissions:
  contents: read

# Two quick pushes in a row: let them run one after another so the same release isn't created twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.released.outputs.released }}
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment shows the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # No dependency needs install scripts; skipping them blocks a compromised package from running code here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$VERSION' is not a valid semver version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Bump \"version\" in package.json or fix the tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released — building only. Bump \"version\" in package.json to publish a new release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run package -- --out "work-monitor-$VERSION.vsix"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: work-monitor-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  release:
    # Separate job: only this one gets write access, and it runs no third-party code.
    needs: build
    if: >-
      needs.build.outputs.released == 'false' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          VSIX="work-monitor-$VERSION.vsix"
          cat > notes.md <<EOF
          ## Install

          1. Download **$VSIX** below.
          2. In VS Code open **Extensions** (Ctrl+Shift+X) → **…** menu → **Install from VSIX…** and pick the file.
             Or run: \`code --install-extension $VSIX --force\`
          3. Reload VS Code windows (**Developer: Reload Window**).

          EOF
          # Creates the tag on this commit if it doesn't exist yet (pushes to main / manual runs).
          gh release create "$TAG" "$VSIX" \
            --target "$GITHUB_SHA" \
            --title "Work Monitor $TAG" \
            --notes-file notes.md \
            --generate-notes
